<style>
/* =========================================================
   HERNÍ POLICE — noční herní stůl
   dark-first · liquid glass · ambient color from the covers
   ========================================================= */
:root{
  color-scheme:dark;
  --bg:#06120E; --bg-2:#0A1B15;
  --glass:rgba(16,38,30,.58); --glass-2:rgba(22,50,40,.72); --glass-edge:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.07);
  --panel:#0E231C; --panel-2:#143027;
  --ink:#F2EDE1; --ink-2:#C8CEC0; --muted:#8AA195;
  --line:rgba(242,237,225,.08); --line-2:rgba(242,237,225,.16);
  --brass:#DDB464; --brass-2:#F4D690; --brass-ink:#1B1406; --brass-soft:rgba(221,180,100,.14);
  --amb:#1C5A45; --amb-2:#4A3A12;
  --shadow:0 1px 0 var(--glass-hi) inset, 0 24px 48px -24px rgba(0,0,0,.7);
  --r-hi:#1C8D59; --r-mid:#2B7BB5; --r-low:#6559AE;
  --ok:#5FD39A;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Geist","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Geist Mono","Cascadia Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --radius:20px;
  --ease:cubic-bezier(.2,.85,.2,1);
  --spring:cubic-bezier(.3,1.35,.4,1);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#ECEFE8; --bg-2:#E1E7DF;
    --glass:rgba(250,251,247,.62); --glass-2:rgba(255,255,255,.8); --glass-edge:rgba(15,31,25,.1); --glass-hi:rgba(255,255,255,.7);
    --panel:#F7F8F4; --panel-2:#EBEFE8;
    --ink:#0F1F19; --ink-2:#2A3B33; --muted:#5B6E64;
    --line:rgba(15,31,25,.09); --line-2:rgba(15,31,25,.18);
    --brass:#8C6413; --brass-2:#AE7E1D; --brass-ink:#FFF8E7; --brass-soft:rgba(140,100,19,.12);
    --amb:#9FCBB6; --amb-2:#E8D29E;
    --shadow:0 1px 0 var(--glass-hi) inset, 0 20px 40px -24px rgba(15,31,25,.35);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ECEFE8; --bg-2:#E1E7DF;
  --glass:rgba(250,251,247,.62); --glass-2:rgba(255,255,255,.8); --glass-edge:rgba(15,31,25,.1); --glass-hi:rgba(255,255,255,.7);
  --panel:#F7F8F4; --panel-2:#EBEFE8;
  --ink:#0F1F19; --ink-2:#2A3B33; --muted:#5B6E64;
  --line:rgba(15,31,25,.09); --line-2:rgba(15,31,25,.18);
  --brass:#8C6413; --brass-2:#AE7E1D; --brass-ink:#FFF8E7; --brass-soft:rgba(140,100,19,.12);
  --amb:#9FCBB6; --amb-2:#E8D29E;
  --shadow:0 1px 0 var(--glass-hi) inset, 0 20px 40px -24px rgba(15,31,25,.35);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#06120E; --bg-2:#0A1B15;
  --glass:rgba(16,38,30,.58); --glass-2:rgba(22,50,40,.72); --glass-edge:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.07);
  --panel:#0E231C; --panel-2:#143027;
  --ink:#F2EDE1; --ink-2:#C8CEC0; --muted:#8AA195;
  --line:rgba(242,237,225,.08); --line-2:rgba(242,237,225,.16);
  --brass:#DDB464; --brass-2:#F4D690; --brass-ink:#1B1406; --brass-soft:rgba(221,180,100,.14);
  --amb:#1C5A45; --amb-2:#4A3A12;
  --shadow:0 1px 0 var(--glass-hi) inset, 0 24px 48px -24px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
::selection{background:var(--brass);color:var(--brass-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* ambient light field */
.ambient{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;transition:background 1.4s var(--ease)}
.ambient i:nth-child(1){width:60vmax;height:60vmax;left:45%;top:-5%;background:var(--amb);animation:drift 26s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:48vmax;height:48vmax;left:-5%;top:35%;background:var(--amb-2);opacity:.35;animation:drift 32s ease-in-out infinite alternate-reverse}
.ambient::after{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.3px);background-size:4px 4px}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-8vmax,6vmax,0) scale(1.12)}}

.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,2.6vw,36px)}
.glass{background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg) 62%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.top .wrap{display:flex;align-items:center;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);flex:none}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--brass-2),var(--brass));color:var(--brass-ink);box-shadow:0 8px 20px -10px var(--brass),inset 0 1px 0 rgba(255,255,255,.35)}
.brand b{font:italic 600 22px/1 var(--f-display);letter-spacing:.1px;white-space:nowrap}
.brand small{display:block;font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.search-slot{flex:1;display:flex;justify-content:center;min-width:0}
.search{position:relative;width:100%;max-width:600px}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line-2);background:var(--glass-2);padding:0 76px 0 44px;font-size:15px;transition:border-color .2s,box-shadow .25s,background .2s}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 5px var(--brass-soft)}
.search .ico{position:absolute;left:15px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search .keys{position:absolute;right:12px;top:50%;translate:0 -50%;display:flex;gap:4px;pointer-events:none}
kbd{font:500 11px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:3px 6px;background:var(--panel)}
.search .clear{position:absolute;right:7px;top:50%;translate:0 -50%;width:34px;height:34px;border:0;border-radius:10px;background:var(--line);color:var(--ink-2);display:grid;place-items:center}
.icon-btn{width:46px;height:46px;flex:none;border-radius:14px;border:1px solid var(--line-2);background:var(--glass-2);display:grid;place-items:center;transition:border-color .2s,transform .15s}
.icon-btn:hover{border-color:var(--brass)}
.icon-btn:active{transform:scale(.94)}
.btn{height:46px;border-radius:14px;border:1px solid var(--line-2);background:var(--glass-2);display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 16px;font-weight:600;font-size:14px;white-space:nowrap;transition:transform .15s,border-color .2s,filter .2s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brass)}
.btn:active{transform:scale(.96)}
.gold{background:linear-gradient(150deg,var(--brass-2),var(--brass));color:var(--brass-ink);border-color:transparent;box-shadow:0 12px 26px -12px var(--brass),inset 0 1px 0 rgba(255,255,255,.4)}
.gold:hover{filter:brightness(1.07)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--brass);color:var(--brass-ink);font:600 11px/20px var(--f-mono);text-align:center;padding:0 6px}
.rolling .die{animation:roll .75s var(--ease)}
@keyframes roll{0%{transform:rotate(0) scale(1)}45%{transform:rotate(320deg) scale(1.3)}100%{transform:rotate(720deg) scale(1)}}
.theme-ico .moon{display:none}
:root[data-theme="light"] .theme-ico .sun{display:none} :root[data-theme="light"] .theme-ico .moon{display:block}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .theme-ico .sun{display:none}:root:not([data-theme="dark"]) .theme-ico .moon{display:block}}

/* ---------- hero bento ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr));gap:14px;padding-block:28px 22px}
.tile{border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;min-width:0}
.tile.lead{padding:26px 28px;display:grid;align-content:end;gap:10px;min-height:220px}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.15em;text-transform:uppercase;color:var(--brass);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.eyebrow .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--ok)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,currentColor 60%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.sample-note{color:var(--brass)}
h1{font:500 clamp(40px,5.4vw,78px)/.95 var(--f-display);letter-spacing:-.025em;margin:4px 0 0;text-wrap:balance}
h1 em{font-style:italic;background:linear-gradient(100deg,var(--brass-2),var(--brass) 60%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.tile.lead p{margin:0;color:var(--ink-2);max-width:52ch}
.stat-k{font:500 10.5px/1.35 var(--f-mono);letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.stat-v{font:500 44px/1 var(--f-display);letter-spacing:-.02em;margin-top:14px;font-variant-numeric:lining-nums tabular-nums}
.stat-s{color:var(--ink-2);font-size:13.5px;margin-top:8px}
.hist{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:16px}
.hist button{flex:1;display:grid;gap:5px;align-content:end;height:100%;border:0;background:none;padding:0;color:var(--muted);font:500 10px var(--f-mono)}
.hist i{display:block;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--brass-2),var(--brass));opacity:.75;min-height:3px;transition:opacity .2s,transform .3s var(--ease);transform-origin:bottom}
.hist button:hover i{opacity:1;transform:scaleY(1.06)}
.hist button:hover{color:var(--ink)}
.tile.game{display:grid;grid-template-rows:auto 1fr auto;gap:10px;text-align:left;border:1px solid var(--glass-edge);cursor:pointer;color:var(--ink);transition:transform .35s var(--ease),border-color .3s}
.tile.game:hover{transform:translateY(-3px);border-color:var(--line-2)}
.tile.game .mini{height:84px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,color-mix(in oklab,var(--c) 80%,white 8%),color-mix(in oklab,var(--c) 55%,black 55%));overflow:hidden}
.tile.game .mini img{height:74px;width:auto;max-width:90%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.tile.game .mini span{font:italic 600 26px var(--f-display);color:rgba(255,255,255,.8)}
.tile.game strong{font-size:14.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- quick rail ---------- */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:30;margin-inline:calc(-1 * clamp(16px,2.6vw,36px));padding:10px clamp(16px,2.6vw,36px);background:linear-gradient(var(--bg) 40%,color-mix(in oklab,var(--bg) 0%,transparent));}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-block:2px;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:none;scroll-snap-align:start;height:38px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;transition:all .2s var(--ease)}
.qchip svg{color:var(--brass)}
.qchip:hover{border-color:var(--brass)}
.qchip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);box-shadow:0 10px 22px -12px var(--brass)}
.qchip[aria-pressed="true"] svg{color:currentColor}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:316px minmax(0,1fr);gap:26px;align-items:start;padding-bottom:72px}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);max-height:calc(100dvh - 150px);overflow:auto;overscroll-behavior:contain;border-radius:22px;padding:4px 20px 20px}
.f-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px}
.f-head h2{margin:0;font:italic 600 24px/1 var(--f-display)}
.linkbtn{border:0;background:none;color:var(--brass);font-weight:600;font-size:13px;padding:6px 2px}
.linkbtn:disabled{opacity:.35;cursor:default}
.f-group{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:12px}
.f-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.f-label>span:first-child{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f-val{font:500 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.seats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.seat{height:42px;border-radius:11px;border:1px solid var(--line-2);background:transparent;font:500 14px var(--f-mono);display:grid;place-items:center;transition:all .2s var(--ease)}
.seat:hover{border-color:var(--brass)}
.seat[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);box-shadow:0 10px 20px -12px var(--brass);transform:translateY(-1px)}
.range{position:relative;height:30px;touch-action:none}
.range .track{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--line-2)}
.range .fill{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:linear-gradient(90deg,var(--brass),var(--brass-2));box-shadow:0 0 12px var(--brass-soft)}
.range input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;height:30px}
.range input::-webkit-slider-runnable-track{background:none;height:30px}
.range input::-moz-range-track{background:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:24px;height:24px;border-radius:50%;margin-top:3px;background:var(--ink);border:4px solid var(--brass);box-shadow:0 4px 12px -2px rgba(0,0,0,.5);cursor:grab;transition:transform .2s var(--spring)}
.range input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--ink);border:4px solid var(--brass);cursor:grab}
.range input:active::-webkit-slider-thumb{transform:scale(1.2);cursor:grabbing}
.range input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 6px var(--brass-soft)}
.ticks{display:flex;justify-content:space-between;font:400 11px var(--f-mono);color:var(--muted);margin-top:-4px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:all .2s var(--ease)}
.chip small{font:500 11px var(--f-mono);color:var(--muted)}
.chip:hover{border-color:var(--brass)}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass)}
.chip[aria-pressed="true"] small{color:var(--brass)}
.chip:disabled{opacity:.3;cursor:default}
.more{justify-self:start}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;cursor:pointer}
.toggle small{display:block;color:var(--muted);font-size:12px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--line-2);transition:.25s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:.3s var(--spring)}
.switch input:checked+span{background:var(--brass)}
.switch input:checked+span::after{transform:translateX(18px);background:var(--brass-ink)}
.switch input:focus-visible+span{box-shadow:0 0 0 4px var(--brass-soft)}
.sheet-foot,.grab{display:none}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.count{margin-right:auto;font-size:15px;color:var(--ink-2)}
.count b{font:500 22px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.count span{color:var(--muted)}
.select{position:relative}
.select select{-webkit-appearance:none;appearance:none;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);padding:0 36px 0 13px;font-size:14px;font-weight:500}
.select::after{content:"";position:absolute;right:15px;top:15px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);rotate:45deg;pointer-events:none}
.seg{display:flex;padding:3px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2)}
.seg button{width:36px;height:32px;border:0;border-radius:9px;background:transparent;display:grid;place-items:center;color:var(--muted);transition:.2s}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.4)}
.active{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.active:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line-2);padding:4px 5px 4px 12px;font-size:12.5px;animation:pop-in .3s var(--spring)}
.pill button{width:22px;height:22px;border-radius:50%;border:0;background:var(--line);display:grid;place-items:center}
.pill button:hover{background:var(--brass);color:var(--brass-ink)}
@keyframes pop-in{from{transform:scale(.8);opacity:0}}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);background:var(--glass);border:1px solid var(--glass-edge);cursor:pointer;outline-offset:3px;
  content-visibility:auto;contain-intrinsic-size:auto 360px;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s;transform-style:preserve-3d;will-change:transform}
.card.enter{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.card:hover{border-color:var(--line-2);box-shadow:0 30px 50px -30px color-mix(in oklab,var(--c) 70%,black),0 0 0 1px var(--glass-edge)}
.cover{position:relative;aspect-ratio:1/1;border-radius:calc(var(--radius) - 6px);margin:6px 6px 0;overflow:hidden;isolation:isolate;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 20%,color-mix(in oklab,var(--c) 85%,white 10%),color-mix(in oklab,var(--c) 55%,black 60%) 75%)}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.3px) 0 0/8px 8px}
.cover .glare{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.28),transparent 45%)}
.card:hover .glare{opacity:1}
.cover img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5)) drop-shadow(0 2px 3px rgba(0,0,0,.4));transition:transform .6s var(--ease);opacity:0}
.cover img.ok{opacity:1;transition:transform .6s var(--ease),opacity .5s}
.card:hover .cover img{transform:translateZ(30px) scale(1.04)}
.gen{position:absolute;inset:12px;display:grid;place-items:center;text-align:center;border:1px solid rgba(244,214,144,.4);border-radius:10px;padding:16px;color:#F7F1E1;z-index:-1}
.gen b{font:italic 600 clamp(18px,1.8vw,23px)/1.08 var(--f-display);text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.gen i{position:absolute;right:-4px;bottom:-24px;font:italic 600 120px/1 var(--f-display);color:rgba(255,255,255,.07)}
.has-img .gen{opacity:0}
.hex{position:absolute;top:10px;right:10px;z-index:4;width:44px;height:39px;display:grid;place-items:center;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);font:600 13.5px var(--f-mono);color:#fff;background:var(--r-hi);font-variant-numeric:tabular-nums}
.hex.mid{background:var(--r-mid)}.hex.low{background:var(--r-low)}
.flag{position:absolute;left:10px;z-index:4;font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:8px;background:rgba(6,18,14,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);color:#F4D690}
.flag.best{top:10px;color:#9FF0C4}
.flag.cz{bottom:10px}
.info{padding:12px 14px 14px;display:grid;gap:8px;flex:1;align-content:start}
.info h3{margin:0;font-weight:600;font-size:15.5px;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font:400 12px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.m{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;background:var(--line);font:500 12px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.m svg{color:var(--muted);flex:none}
.wrow{display:flex;align-items:center;gap:8px;white-space:nowrap;font:400 12px var(--f-mono);color:var(--muted)}
.pips{position:relative;width:60px;height:10px;flex:none;background:radial-gradient(circle,var(--line-2) 3.2px,transparent 3.7px) 0 0/12px 10px}
.pips::after{content:"";position:absolute;inset:0;width:var(--w);background:radial-gradient(circle,var(--brass) 3.2px,transparent 3.7px) 0 0/12px 10px}
.plays{display:none}

/* list view (desktop / Windows) */
.grid.list{grid-template-columns:1fr;gap:8px}
.grid.list .card{flex-direction:row;align-items:center;contain-intrinsic-size:auto 84px;border-radius:16px}
.grid.list .card:hover{transform:none!important}
.grid.list .cover{width:68px;flex:none;margin:7px;border-radius:11px}
.grid.list .cover img{width:86%;height:86%}
.grid.list .hex,.grid.list .flag,.grid.list .gen i{display:none}
.grid.list .gen{inset:4px;padding:4px}.grid.list .gen b{font-size:11px}
.grid.list .info{flex:1;display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.6fr) 190px 70px 64px;align-items:center;gap:16px;padding:8px 18px 8px 8px}
.grid.list .title-wrap{min-width:0}
.grid.list .rt{display:block}
.grid.list .plays{display:block}
.rt{display:none;font:600 15px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.plays{font:500 13px var(--f-mono);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.list-head{display:none}
.grid.list+.list-head,.list-head.on{display:grid}
.list-head{grid-template-columns:82px minmax(0,2.4fr) minmax(0,1.6fr) 190px 70px 64px;gap:16px;padding:0 26px 8px 0;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.list-head button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left}
.list-head button:hover,.list-head button.on{color:var(--brass)}
.list-head .r{text-align:right}

.empty{grid-column:1/-1;text-align:center;padding:72px 20px;border:1px dashed var(--line-2);border-radius:22px}
.empty h3{font:italic 500 34px/1.1 var(--f-display);margin:12px 0 8px}
.empty p{color:var(--muted);margin:0 auto 20px;max-width:40ch}

/* ---------- detail ---------- */
dialog{border:1px solid var(--glass-edge);border-radius:28px;padding:0;background:var(--panel);color:var(--ink);width:min(1000px,calc(100% - 40px));max-height:min(90dvh,900px);box-shadow:0 50px 100px -40px rgba(0,0,0,.8);overflow:hidden}
dialog::backdrop{background:rgba(3,10,8,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
dialog[open]{animation:dlg .45s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(20px) scale(.97)}}
.d-scroll{max-height:inherit;overflow:auto;overscroll-behavior:contain}
.d-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.d-cover{position:relative;min-height:100%;display:grid;place-items:center;padding:48px 32px;overflow:hidden;isolation:isolate;
  background:radial-gradient(110% 80% at 50% 25%,color-mix(in oklab,var(--c) 85%,white 12%),color-mix(in oklab,var(--c) 50%,black 65%) 80%)}
.d-cover img{max-width:88%;max-height:440px;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(0,0,0,.55))}
.d-cover .gen{position:relative;inset:auto;width:80%;aspect-ratio:1;z-index:0}
.d-cover .gen b{font-size:34px}
.d-body{padding:34px 34px 30px;display:grid;gap:20px;align-content:start}
.d-close{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass-2);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:5}
.d-close:hover{border-color:var(--brass)}
.d-body h2{margin:0;font:italic 600 clamp(30px,3.6vw,46px)/1 var(--f-display);letter-spacing:-.015em;text-wrap:balance;padding-right:40px}
.bestline{display:flex;flex-wrap:wrap;gap:8px}
.bl{display:inline-flex;gap:7px;align-items:center;font-size:13px;border-radius:10px;padding:6px 10px;background:var(--line)}
.bl b{font-family:var(--f-mono);font-weight:500}
.bl.best{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stat{background:var(--panel);padding:13px 14px;display:grid;gap:5px;align-content:start}
.stat span{font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat b{font:500 18px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.desc{color:var(--ink-2);font-size:15px;line-height:1.6;margin:0;max-width:62ch}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.d-actions{display:flex;flex-wrap:wrap;gap:10px}
.sim-h{margin:0 0 10px;font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sim{border:1px solid var(--line);background:transparent;border-radius:14px;padding:8px;text-align:left;display:grid;gap:8px;transition:border-color .2s,transform .3s var(--ease)}
.sim:hover{border-color:var(--brass);transform:translateY(-2px)}
.sim .mini{aspect-ratio:4/3;border-radius:9px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,color-mix(in oklab,var(--c) 80%,white 8%),color-mix(in oklab,var(--c) 55%,black 55%))}
.sim .mini img{height:80%;width:auto;max-width:86%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.sim .mini span{font:italic 600 20px var(--f-display);color:rgba(255,255,255,.8)}
.sim strong{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sim small{font:11.5px var(--f-mono);color:var(--muted)}

::view-transition-old(hero-cover),::view-transition-new(hero-cover){animation-duration:.45s;animation-timing-function:cubic-bezier(.2,.85,.2,1)}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.85,.2,1)}

/* ---------- footer, toast ---------- */
footer{border-top:1px solid var(--line);padding-block:30px 44px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:center}
footer p{margin:0}
.bgg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;color:var(--ink-2);text-decoration:none;font-weight:500}
.bgg b{font-family:var(--f-mono);color:#FF5100;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);translate:-50% 20px;z-index:90;padding:12px 18px;border-radius:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s,translate .4s var(--spring)}
.toast.show{opacity:1;translate:-50% 0}
.dock,.scrim,.spacer-m{display:none}

/* =========================================================
   PHONES & TABLETS  (19,5:9 and friends)
   ========================================================= */
@media (max-width: 1023px){
  html{scroll-padding-top:70px}
  .top .wrap{height:60px}
  .top .search-slot,.top .hide-m,.list-head{display:none!important}
  .spacer-m{display:block}
  .top{position:relative}
  .hero{grid-template-columns:repeat(3,minmax(0,1fr));padding-block:16px 12px;gap:10px}
  .tile.lead{grid-column:1/-1;min-height:0;padding:22px 20px}
  .tile{padding:14px}
  .stat-v{font-size:32px;margin-top:10px}
  .tile.game .mini{height:64px}.tile.game .mini img{height:56px}
  .rail{top:env(safe-area-inset-top,0px)}
  .layout{grid-template-columns:minmax(0,1fr);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .seg{display:none}
  /* bottom sheet */
  .filters{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:70;max-height:88dvh;border-radius:28px 28px 0 0;padding:0 20px;
    transform:translateY(105%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s;background:var(--panel);backdrop-filter:none}
  .filters.open{transform:translateY(var(--drag,0px));visibility:visible;transition:transform .5s var(--ease)}
  .filters.dragging{transition:none}
  .grab{display:block;position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 0 2px;touch-action:none;cursor:grab}
  .grab::before{content:"";display:block;width:46px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto}
  .sheet-foot{display:block;position:sticky;bottom:0;background:linear-gradient(transparent,var(--panel) 30%);padding:18px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:4px}
  .sheet-foot .btn{width:100%;height:54px;font-size:15.5px;border-radius:16px}
  .scrim{display:block;position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
  .scrim.show{opacity:1;pointer-events:auto}
  /* floating dock – thumb zone */
  .dock{display:flex;position:fixed;z-index:50;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);gap:8px;padding:7px;border-radius:24px;align-items:center;transition:transform .25s var(--ease);background:color-mix(in oklab,var(--panel) 88%,transparent);box-shadow:0 20px 40px -12px rgba(0,0,0,.55),inset 0 1px 0 var(--glass-hi)}
  .dock .search{flex:1}
  .dock .search input{height:50px;border-radius:18px;padding-right:48px;background:var(--glass-2);font-size:16px}
  .dock .search .keys{display:none}
  .dock .icon-btn{width:50px;height:50px;border-radius:18px;position:relative}
  .dock .icon-btn .badge{position:absolute;top:-4px;right:-4px;box-shadow:0 0 0 3px var(--bg)}
  .dock .gold{width:50px;height:50px;padding:0;border-radius:18px}
  dialog{width:100%;max-width:100%;max-height:94dvh;margin:auto 0 0;border-radius:28px 28px 0 0;border-bottom:0}
  dialog[open]{animation:sheet-up .5s var(--ease)}
  @keyframes sheet-up{from{transform:translateY(30%);opacity:.3}}
  .d-grid{grid-template-columns:1fr}
  .d-cover{min-height:0;padding:40px 24px 28px}
  .d-cover img{max-height:34dvh}
  .d-cover .gen{width:56%}
  .d-body{padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
}
@media (max-width: 640px){
  .hero{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile.game .mini{display:none}
  .tile{padding:12px}
  .stat-k{font-size:9.5px;letter-spacing:.1em}
  .stat-v{font-size:26px}
  .stat-s,.tile.game strong{font-size:12.5px}
  h1{font-size:clamp(34px,10vw,46px)}
  .tile.lead{padding:18px 18px 20px;gap:8px}
  .tile.lead p{font-size:14px}
  .hist{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{border-radius:18px}
  .cover{margin:5px 5px 0;border-radius:14px}
  .info{padding:10px 11px 12px;gap:7px}
  .info h3{font-size:14px}
  .sub{display:none}
  .m{height:24px;padding:0 7px;font-size:11.5px}
  .hex{width:38px;height:34px;font-size:12px;top:8px;right:8px}
  .flag{left:8px;font-size:9px;padding:5px 6px}.flag.best{top:8px}.flag.cz{bottom:8px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sims{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .sim small{display:none}
}
@media (max-width: 350px){.grid{grid-template-columns:1fr}}
@media (hover:none){.card:hover{transform:none}.card:active{transform:scale(.98)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .ambient i{animation:none}
}

    <div class="search-slot" id="slotTop">
      <label class="search" id="searchBox">
        <svg class="ico" width="18" height="18"><use href="#i-search"/></svg>

const RANGES={};
function dualRange(key,{min,max,step,label}){
  const host=$("r-"+key);
  host.innerHTML=`<div class="track"></div><div class="fill"></div>
   <input type="range" id="${key}-a" min="${min}" max="${max}" step="${step}" aria-label="${label} od">
   <input type="range" id="${key}-b" min="${min}" max="${max}" step="${step}" aria-label="${label} do">`;
  const [a,b]=host.querySelectorAll("input"),fill=host.querySelector(".fill");
  const paint=()=>{const lo=Math.max(min,Math.min(max,S[key][0])),hi=Math.max(min,Math.min(max,S[key][1]));
    const pa=(lo-min)/(max-min)*100,pb=(hi-min)/(max-min)*100;fill.style.left=pa+"%";fill.style.width=(pb-pa)+"%";a.value=lo;b.value=hi;a.style.zIndex=lo>max-(max-min)*.12?3:2;};
  const on=i=>e=>{let v=+e.target.value;if(i===0)v=Math.min(v,S[key][1]);else v=Math.max(v,S[key][0]);S[key][i]=Math.round(v*10)/10;paint();schedule();};
  a.addEventListener("input",on(0));b.addEventListener("input",on(1));
  RANGES[key]={paint,min,max};paint();
}

let raf=0,LIST=[],first=true,prevIds="";
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>render(true));}
function render(animate){
  const next=GAMES.filter(g=>matches(g)).sort(SORTS[S.sort]);
  const ids=next.map(g=>g.id).join(",");
  const grid=$("grid");
  const apply=()=>{
    LIST=next;
    if(!next.length){
      grid.innerHTML=`<div class="empty"><svg width="40" height="40" style="color:var(--brass)"><use href="#i-die"/></svg><h3>Police je prázdná</h3><p>Tuhle kombinaci filtrů žádná hra nesplňuje. Zkuste některý uvolnit.</p><button class="btn gold" type="button" id="emptyReset">Zrušit všechny filtry</button></div>`;
      $("emptyReset").onclick=resetAll;
    } else {
      grid.replaceChildren(...next.map((g,i)=>{
        let el=CARD.get(g.id); if(!el){el=mkCard(g);CARD.set(g.id,el);}
        if(first){el.classList.add("enter");el.style.setProperty("--i",Math.min(i,16));el.addEventListener("animationend",()=>el.classList.remove("enter"),{once:true});}
        const b=el.querySelector(".flag.best");
        const n=S.players, isBest=n&&n<7&&g.best.includes(n);
        b.hidden=!isBest; if(isBest) b.textContent=`★ ideální ve ${n}`;
        return el;
      }));
    }
    first=false;
    updateUI();
  };
  const canVT=animate&&!REDUCED&&document.startViewTransition&&ids!==prevIds&&next.length<=40&&LIST.length<=40&&S.view==="grid";
  if(canVT){
    const named=new Set();
    LIST.forEach(g=>{const el=CARD.get(g.id);if(el){el.style.viewTransitionName="g"+g.id;named.add(el);}});
    const t=document.startViewTransition(()=>{apply();next.forEach(g=>{const el=CARD.get(g.id);el.style.viewTransitionName="g"+g.id;named.add(el);});});
    t.finished.finally(()=>named.forEach(el=>el.style.viewTransitionName=""));
  } else apply();
  prevIds=ids;
}

/* ======================= URL a sdílení ======================= */
function stateToQuery(){
  const p=new URLSearchParams();
  if(S.qRaw)p.set("q",S.qRaw); if(S.players)p.set("h",S.players); if(S.rec)p.set("dop","1");
  if(S.time[0]>0||S.time[1]<240)p.set("cas",S.time.join("-")); if(S.weight[0]>1||S.weight[1]<5)p.set("obt",S.weight.join("-"));
  if(S.rating[0]>5||S.rating[1]<9)p.set("bgg",S.rating.join("-")); if(S.year[0]>YMIN||S.year[1]<YMAX)p.set("rok",S.year.join("-"));
  if(S.cats.size)p.set("kat",[...S.cats].join("|")); if(S.cz)p.set("cz","1"); if(S.unplayed)p.set("nehrane","1");
  if(S.sort!=="rating")p.set("razeni",S.sort);
  return p.toString();
}
function syncURL(){ if(META.sample) return; try{const s=stateToQuery();history.replaceState(null,"",location.pathname+(s?"?"+s:"")+location.hash)}catch{} }
function readURL(){
  let p; try{p=new URLSearchParams(location.search)}catch{return}
  const pair=(k,d)=>{const v=p.get(k);if(!v)return d;const a=v.split("-").map(Number);return a.length===2&&a.every(x=>!isNaN(x))?a:d};
  if(p.get("q")) setQuery(p.get("q"),true);
  S.players=+p.get("h")||0; S.rec=p.get("dop")==="1";
  S.time=pair("cas",S.time); S.weight=pair("obt",S.weight); S.rating=pair("bgg",S.rating); S.year=pair("rok",S.year);
  if(p.get("kat")) S.cats=new Set(p.get("kat").split("|").filter(c=>ALLCATS.includes(c)));
  S.cz=p.get("cz")==="1"; S.unplayed=p.get("nehrane")==="1";
  if(SORTS[p.get("razeni")]) S.sort=p.get("razeni");
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
$("share").addEventListener("click",()=>{
  const s=stateToQuery(); let url=location.href;
  try{url=location.origin+location.pathname+(s?"?"+s:"")}catch{}
  const fallback=()=>{toast("Odkaz: "+url)};
  try{navigator.clipboard.writeText(url).then(()=>toast(s?"Odkaz na tento výběr je zkopírovaný":"Odkaz na polici je zkopírovaný"),fallback)}catch{fallback()}
});

/* ======================= hledání ======================= */
const q=$("q");
function setQuery(v,silent){q.value=v;S.qRaw=v.trim();S.q=norm(S.qRaw);$("qclear").hidden=!v;$("keys").hidden=!!v;if(!silent)schedule();}
q.addEventListener("input",()=>setQuery(q.value));
q.addEventListener("keydown",e=>{if(e.key==="Enter"){q.blur();} if(e.key==="Escape"){setQuery("");q.blur();}});
$("qclear").addEventListener("click",()=>{setQuery("");q.focus();});
document.addEventListener("keydown",e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k")||(e.key==="/"&&!typing)){e.preventDefault();q.focus();q.select();}
  else if(!typing&&!dlg.open&&(e.key==="r"||e.key==="R")&&!e.ctrlKey&&!e.metaKey){roll();}
});
/* hledání v doku na telefonu, i při otevřené klávesnici */
const mqMobile=matchMedia("(max-width: 1023px)");
function placeSearch(){ (mqMobile.matches?$("slotDock"):$("slotTop")).appendChild($("searchBox")); q.placeholder=mqMobile.matches?"Hledat hru…":"Hledat hru nebo kategorii"; }
mqMobile.addEventListener?.("change",placeSearch); placeSearch();
if(window.visualViewport){
  const dock=$("dock");
  const fix=()=>{const off=window.innerHeight-visualViewport.height-visualViewport.offsetTop;dock.style.transform=off>40?`translateY(${-off}px)`:"";};
  visualViewport.addEventListener("resize",fix);visualViewport.addEventListener("scroll",fix);
}

/* ======================= ovládání ======================= */
$("seats").innerHTML=[1,2,3,4,5,6,7].map(n=>`<button type="button" class="seat" data-n="${n}" aria-pressed="false" aria-label="${n===7?"7 a více hráčů":n+" "+plural(n,"hráč","hráči","hráčů")}">${n===7?"7+":n}</button>`).join("");
$("seats").addEventListener("click",e=>{const b=e.target.closest(".seat");if(!b)return;const n=+b.dataset.n;S.players=S.players===n?0:n;if(!S.players)S.rec=false;schedule();});
$("recOnly").addEventListener("change",e=>{S.rec=e.target.checked;schedule();});
$("cats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b||b.disabled)return;const c=b.dataset.c;S.cats.has(c)?S.cats.delete(c):S.cats.add(c);schedule();});
$("moreCats").addEventListener("click",()=>{catsOpen=!catsOpen;renderCats();});
$("czOnly").addEventListener("change",e=>{S.cz=e.target.checked;schedule();});
$("unplayed").addEventListener("change",e=>{S.unplayed=e.target.checked;schedule();});
$("sort").addEventListener("change",e=>{S.sort=e.target.value;schedule();});
$("listHead").addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.sort=b.dataset.s;schedule();}});
$("vGrid").addEventListener("click",()=>{S.view="grid";store.set("hp-view","grid");render(false);});
$("vList").addEventListener("click",()=>{S.view="list";store.set("hp-view","list");render(false);});
$("reset").addEventListener("click",resetAll);
$("active").addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(!b)return;$("active")._act[+b.dataset.k][1]();schedule();});
$("quick").addEventListener("click",e=>{const b=e.target.closest(".qchip");if(!b)return;const x=QUICK.find(k=>k.k===b.dataset.k);
  if(x.cat){S.cats.has(x.cat)?S.cats.delete(x.cat):S.cats.add(x.cat);} else x.set(!x.on());
  if(!S.players)S.rec=false; schedule();});
$("grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openDetail(c.dataset.id,c);});
$("grid").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("card")){e.preventDefault();openDetail(e.target.dataset.id,e.target);}});
$("hero").addEventListener("click",e=>{const hb=e.target.closest("[data-band]");if(hb){const b=BANDS[+hb.dataset.band];S.weight=[Math.max(1,b[0]),Math.min(5,Math.round((b[1]-.1)*10)/10)];schedule();$("grid").scrollIntoView({behavior:REDUCED?"auto":"smooth",block:"start"});return;}const t=e.target.closest("[data-open]");if(t)openDetail(t.dataset.open,CARD.get(+t.dataset.open)?.isConnected?CARD.get(+t.dataset.open):null);});
document.querySelectorAll(".roll-btn").forEach(b=>b.addEventListener("click",()=>roll()));

/* vzhled */
const THEMEKEY="hp-theme";
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); }
applyTheme(store.get(THEMEKEY));
$("theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  const nt=cur==="light"?"dark":"light";
  const go=()=>{applyTheme(nt);store.set(THEMEKEY,nt);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=nt==="light"?"#ECEFE8":"#06120E";};
  document.startViewTransition&&!REDUCED?document.startViewTransition(go):go();
});

/* spodní panel filtrů s tažením */
const filters=$("filters"),scrim=$("scrim");
function sheet(open){filters.classList.toggle("open",open);scrim.classList.toggle("show",open);document.body.style.overflow=open?"hidden":"";filters.style.removeProperty("--drag");}
$("openFilters").addEventListener("click",()=>sheet(true));
$("closeFilters").addEventListener("click",()=>sheet(false));
scrim.addEventListener("click",()=>sheet(false));
(()=>{let y0=null,dy=0;
  $("grab").addEventListener("pointerdown",e=>{y0=e.clientY;dy=0;filters.classList.add("dragging");$("grab").setPointerCapture(e.pointerId);});
  $("grab").addEventListener("pointermove",e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);filters.style.setProperty("--drag",dy+"px");});
  const end=()=>{if(y0===null)return;filters.classList.remove("dragging");y0=null;if(dy>110)sheet(false);else filters.style.setProperty("--drag","0px");};
  $("grab").addEventListener("pointerup",end);$("grab").addEventListener("pointercancel",end);
})();

/* ======================= start ======================= */
async function load(){
  try{
    const r=await fetch("data/games.json",{cache:"no-cache"}); if(!r.ok) throw 0;
    const j=await r.json(); if(!Array.isArray(j.games)||!j.games.length) throw 0;
    GAMES=j.games; META={sample:false,updated:j.updated,user:j.user};
  }catch{ GAMES=sampleGames(); META={sample:true,user:"JakSeRodi"}; }
  GAMES.forEach(g=>{g.c=g.c||[];g.best=g.best||[];g.rec=g.rec||[];g.pl=g.pl||0;g.w=g.w||0;g.r=g.r||0;g.tt=g.t[1]||g.t[0]||0;g._s=norm(g.n+" "+(g.alt||"")+" "+g.c.join(" "));});
  const freq={};GAMES.forEach(g=>g.c.forEach(c=>freq[c]=(freq[c]||0)+1));
  ALLCATS=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]||a.localeCompare(b,"cs"));
  const ys=GAMES.map(g=>g.y).filter(Boolean); YMIN=Math.min(...ys); YMAX=Math.max(...ys); S.year=[YMIN,YMAX];
  $("owner").textContent="@"+(META.user||"JakSeRodi");
  dualRange("time",{min:0,max:240,step:15,label:"Herní doba"});
  dualRange("weight",{min:1,max:5,step:.1,label:"Obtížnost"});
  dualRange("rating",{min:5,max:9,step:.1,label:"Hodnocení"});
  dualRange("year",{min:YMIN,max:YMAX,step:1,label:"Rok vydání"});
  $("quick").innerHTML=QUICK.filter(x=>!x.cat||ALLCATS.includes(x.cat)).map(x=>`<button type="button" class="qchip" data-k="${x.k}" aria-pressed="false"><svg width="15" height="15"><use href="#${x.i}"/></svg>${x.l}</button>`).join("");
  const v=store.get("hp-view"); if(v==="list"&&!mqMobile.matches) S.view="list";
  if(!META.sample) readURL();
  renderHero(); render(false);
  const h=location.hash.match(/^#hra-(\d+)/); if(h&&!META.sample) openDetail(h[1]);
  if(!META.sample&&"serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
load();
</script>
